# Render Blueprint: despliega el backend de MeetTennis.
# Render → New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: meettennis-api
    runtime: node
    plan: free
    rootDir: meet-tennis/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
