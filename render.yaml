# Render Blueprint: despliega el backend de MeetTennis.
# Render → New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: meettennis-api
    runtime: node
    plan: free
    rootDir: meet-tennis/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Dominio del frontend (Vercel) para permitir peticiones
      # cross-origin directas. El proxy de Vercel funciona igual,
      # pero sin esto se deniegan los orígenes externos.
      - key: CORS_ORIGIN
        value: https://meettennis.vercel.app
      # Correos admin (separados por coma) para el panel de monitoreo,
      # mientras no se ejecute scripts/09_admin_rol.sql en Supabase.
      - key: MONITORING_EMAILS
        sync: false
